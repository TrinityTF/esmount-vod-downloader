# Every push to main builds the Windows installer and publishes it as a GitHub release.
# Pushes to beta do the same as a pre-release (version x.y.N-beta), which only installs
# with "Beta updates" switched on in Settings are offered. The run number is shared by
# both branches, so every build has a higher version than the one before.
name: Build and release

on:
  push:
    branches: [main, beta]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      CHANNEL: ${{ github.ref_name == 'beta' && 'beta' || 'stable' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set version and release notes
        run: node scripts/prepare-release.js ${{ github.run_number }} ${{ env.CHANNEL }}

      # The draft release is created up front; electron-builder only uploads files into it
      # (letting it create the release races between its parallel uploads).
      - name: Create draft release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          flags=(); [ "$CHANNEL" = beta ] && flags=(--prerelease)
          gh release create "v$version" --draft "${flags[@]}" --title "$version" --target "$GITHUB_SHA" --notes-file build/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build installer and upload it
        shell: bash
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Published only once every file is there, so the app never sees a half-uploaded release.
      - name: Publish release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$CHANNEL" = beta ]; then
            gh release edit "v$version" --draft=false --prerelease --latest=false
          else
            gh release edit "v$version" --draft=false --latest
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
