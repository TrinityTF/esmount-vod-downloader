# Every push to main builds the Windows installer and publishes it as a GitHub release.
# Installed copies of the app see the new release and ask their users to update.
name: Build and release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set version and release notes
        run: node scripts/prepare-release.js ${{ github.run_number }}

      # The draft release is created up front; electron-builder only uploads files into it
      # (letting it create the release races between its parallel uploads).
      - name: Create draft release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          gh release create "v$version" --draft --title "$version" --target "$GITHUB_SHA" --notes-file build/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build installer and upload it
        shell: bash
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Published only once every file is there, so the app never sees a half-uploaded release.
      - name: Publish release
        shell: bash
        run: gh release edit "v$(node -p "require('./package.json').version")" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
